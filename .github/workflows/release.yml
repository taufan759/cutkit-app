name: Build installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust stable
        run: rustup default stable

      - name: npm
        run: npm ci

      - name: Test
        run: |
          cargo build --release -p cutkit-cli --locked
          node --test "tests/*.test.js"
          cargo test -p cutkit-core --release --locked

      - name: Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Installer
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and "v$v" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME tidak sama dengan versi tauri.conf.json ($v)"
          }
          ./installer/build.ps1 -Iscc "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $exe = Get-Item "installer\Output\cutkit-setup-$v.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -Encoding ascii "installer\Output\cutkit-setup-$v.exe.sha256"
          "Ukuran: {0:N2} MB, SHA-256: {1}" -f ($exe.Length / 1MB), $hash

      - uses: actions/upload-artifact@v4
        with:
          name: cutkit-windows
          path: installer/Output/*

      - name: Rilis GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/*
          generate_release_notes: true

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Paket sistem
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev build-essential file

      - name: ffmpeg statis (BtbN) untuk tes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=$(gh release view latest -R BtbN/FFmpeg-Builds --json assets --jq '.assets[].name' | grep -E '^ffmpeg-n[0-9.]+-latest-linux64-gpl-[0-9.]+\.tar\.xz$' | sort -V | tail -1)
          echo "ffmpeg: $name"
          curl -sSfL "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$name" -o /tmp/ffmpeg.tar.xz
          mkdir -p /opt/ffmpeg && tar -xJf /tmp/ffmpeg.tar.xz -C /opt/ffmpeg --strip-components=1
          echo "/opt/ffmpeg/bin" >> "$GITHUB_PATH"

      - name: Rust stable
        run: rustup default stable

      - name: npm
        run: npm ci

      - name: Test
        run: |
          ffmpeg -version | head -1
          cargo build --release -p cutkit-cli --locked
          node --test "tests/*.test.js"
          cargo test -p cutkit-core --release --locked

      - name: Paket .deb dan .AppImage
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ] && [ "v$v" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME != v$v"; exit 1; fi
          npx tauri build --bundles deb,appimage
          mkdir -p dist
          cp target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage dist/
          cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done && ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: cutkit-linux
          path: dist/*

      - name: Rilis GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  macos:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ffmpeg untuk tes (ffmpeg-full: termasuk libass)
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"

      - name: Rust stable + target universal
        run: |
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: npm
        run: npm ci

      - name: Test
        run: |
          ffmpeg -version | head -1
          cargo build --release -p cutkit-cli --locked
          node --test "tests/*.test.js"
          cargo test -p cutkit-core --release --locked

      - name: Paket .dmg (universal)
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ] && [ "v$v" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME != v$v"; exit 1; fi
          sh scripts/build-mac.sh
          mkdir -p dist
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg dist/
          cd dist && for f in *; do shasum -a 256 "$f" > "$f.sha256"; done && ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: cutkit-macos
          path: dist/*

      - name: Rilis GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
